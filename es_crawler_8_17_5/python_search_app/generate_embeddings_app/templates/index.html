<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Embedding Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Image Embedding App</a>
    </div>
</nav>

<div class="content">
    <div class="container py-5">
        <h1 class="text-center mb-4">Generate Image Embeddings</h1>

        <div class="row justify-content-center">
            <!-- Form Section -->
            <div class="col-md-5">
                <form method="post" enctype="multipart/form-data" class="card p-4 shadow-sm">
                    <div class="mb-3">
                        <label for="imageUpload" class="form-label">Upload an Image</label>
                        <input type="file" class="form-control" name="image" accept="image/*">
                    </div>
                    <div class="mb-3 text-center">or</div>
                    <div class="mb-3">
                        <label for="imageUrl" class="form-label">Enter Image URL</label>
                        <input type="url" class="form-control" name="image_url" placeholder="https://example.com/image.jpg">
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Generate Embeddings</button>
                    </div>
                </form>

                {% if error %}
                    <div class="alert alert-danger mt-4" role="alert">
                        {{ error }}
                    </div>
                {% endif %}
            </div>

            <!-- Embeddings Output Section -->
            {% if embeddings %}
            <div class="col-md-7">
                <div class="card p-4 shadow-sm">
                    <h5 class="card-title">Embedding Output (512 values)</h5>
                    <button class="btn btn-outline-secondary btn-sm mb-2" onclick="copyToClipboard()">Copy to Clipboard</button>
                    <div style="font-family: monospace; font-size: 0.9rem;" id="embedding-box">
                        <pre style="white-space: pre-wrap; word-wrap: break-word;">{{ embeddings }}</pre>
                    </div>
                </div>

                <script>
                    function copyToClipboard() {
                        const text = document.getElementById('embedding-box').innerText;
                        navigator.clipboard.writeText(text).then(() => {
                            alert('Embeddings copied to clipboard!');
                        }).catch(err => {
                            console.error('Failed to copy:', err);
                        });
                    }
                </script>
            </div>
            {% endif %}
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">&copy; 2025 Image Embedding App. MIT License.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
